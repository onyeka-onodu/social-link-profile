<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />

    <title>Frontend Mentor | Social links profile</title>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <header class="imgs">
          <img src="assets/images/avatar-jessica.jpeg" />
        </header>
        <main>
          <h1 class="name">Jessica Randal</h1>
          <p class="city">London, United Kingdom</p>
          <p class="job">"Front-end developer and avid reader."</p>
          <ul class="link">
            <li><a class="git" href="#">GitHub</a></li>
            <li><a class="front" href="#">Frontend Mentor</a></li>
            <li><a class="lind" href="#">LinkedIn</a></li>
            <li><a class="twit" href="#">Twitter</a></li>
            <li><a class="insta" href="#">Instagram</a></li>
          </ul>
        </main>
      </div>
    </div>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Onyeka Onodu</a>.
    </footer>
  </body>
</html>
